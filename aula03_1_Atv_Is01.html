<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 03-1_Atv_Js01</title>
</head>
<body>
    <h3>Programa de Boas Vindas!</h3>
    <script language="JavaScript">
        <!--
            /* Objetivo: Capturar o nome do usuário e apresentar uma saúda personalizada
            Definir as variáveis com o prefixo jis_
            Elementos de Entrada: método prompt do objeto window
            Elementos de Saída: método write do objeto window
            */
           /* Definnição de variáveis */
           var js_nome;

           /* Entrada de Dados */
           js_nome = window.prompt ('Entre com seu nome: ' , 'Gabrielly')

           /* Saída de Dados */
           document.write('Olá' + js_nome + 'Seja Bem-Vinda!'); //Mensagem de Saída Personalizada
           
            -->
    </script>
</body>
</html>
